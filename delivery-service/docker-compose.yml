services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgresql+psycopg2://maksim:22ehasaz@db:5432/delivery_db
      - REDIS_URL=redis://redis:6379/0

  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=maksim
      - POSTGRES_PASSWORD=22ehasaz
      - POSTGRES_DB=delivery_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data: